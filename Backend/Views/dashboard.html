<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

    <header class="dashboard-header">
        <div class="logo-area">
            <img src="/images/habit-tracker.jpg" class="header-logo" alt="Logo">
        </div>

        <button class="logout-button" onclick="logout()">Logga ut</button>
    </header>

    <!-- ⭐ TAB-MENY -->
    <nav class="dashboard-tabs">
        <button data-tab="today">Idag</button>
        <button data-tab="habits">Mina vanor</button>
        <button data-tab="new">Ny vana</button>
        <button data-tab="history">Historik</button>
    </nav>

    <main class="dashboard-container">

        <!-- Dagens vanor -->
        <section id="today" class="section-card">
            <h2>Dagens vanor</h2>
            <p>Här ser du vad du ska göra idag.</p>
            <ul id="today-habits" class="today-list"></ul>
        </section>

        <!-- Mina vanor -->
        <section id="habits" class="section-card">
            <h2>Mina vanor</h2>
            <ul id="habit-list" class="habits-list"></ul>
        </section>

        <!-- Skapa ny vana -->
        <section id="new" class="section-card">
            <h2>Skapa ny vana</h2>

            <form id="new-habit-form" onsubmit="createHabit(event)">
                <label for="habit-title">Titel</label>
                <input type="text" id="habit-title" required>

                <label for="habit-description">Beskrivning</label>
                <input type="text" id="habit-description">

                <label for="habit-frequency">Frekvens per vecka</label>
                <input type="number" id="habit-frequency" min="1">

                <label for="start_date">Startdatum</label>
                <input type="date" id="start_date" required>

                <button type="submit">Lägg till vana</button>
            </form>
        </section>

        <!-- Historik -->
        <section id="history" class="section-card">
            <h2>Historik</h2>
            <p>Se vilka dagar vanan är klar.</p>

            <label for="history-select">Välj vana</label>
            <select id="history-select" onchange="loadHistory()"></select>

            <ul id="history-list" class="history-list"></ul>
        </section>

    </main>

    <!-- ⭐ REDIGERA-MODAL -->
    <div id="editModal" class="modal hidden">
        <div class="modal-card">
            <h2>Redigera vana</h2>

            <label for="editTitle">Titel</label>
            <input id="editTitle" type="text">

            <label for="editDescription">Beskrivning</label>
            <textarea id="editDescription"></textarea>

            <label for="editFrequency">Frekvens per vecka</label>
            <input id="editFrequency" type="number" min="1">

            <div class="modal-buttons">
                <button id="cancelEdit">Avbryt</button>
                <button id="saveEdit">Spara</button>
            </div>
        </div>
    </div>

    <!-- ⭐ TA BORT-MODAL -->
    <div id="deleteModal" class="modal hidden">
        <div class="modal-card delete-card">
            <h2>Ta bort vana</h2>
            <p>Är du säker på att du vill ta bort denna vana?</p>

            <div class="modal-buttons">
                <button id="cancelDelete">Avbryt</button>
                <button id="confirmDelete" class="danger-btn">Ta bort</button>
            </div>
        </div>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
