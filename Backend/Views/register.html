<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Registrera</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="logo-container">
        <img src="/images/habit-tracker.jpg" alt="Habit Tracker Logo" class="app-logo">
    </div>

    <div class="center-page">
        <div class="card">
            <h1>Skapa konto</h1>

            <input type="text" id="register-email" placeholder="Email" required>
            <input type="password" id="register-password" placeholder="Lösenord" required>

            <button onclick="register(event)">Registrera</button>

            <p>Har du redan konto? <a href="login.html">Logga in</a></p>
        </div>
    </div>

    <script src="/js/auth.js"></script>

</body>
</html>
